name: Java build and smoke tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac PhishingDetector.java
      - run: |
          printf '1\nhttps://example.com\n2\n3\nexample.com\n5\n' | timeout 15 java PhishingDetector > run-output.txt
          grep -q 'Phishing Score' run-output.txt
          grep -q 'SCAN HISTORY' run-output.txt
          grep -q 'SEARCH SCAN HISTORY' run-output.txt
